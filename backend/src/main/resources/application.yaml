# Основное
spring:
  application:
    name: scrapper

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  liquibase:
    change-log: classpath:/migrations/master.xml
    enabled: true

app:
  upload:
    img-path: uploads/img

# Интеграции
usernameverify:
  key: ${USERNAMEVERIFY_KEY}

cdek:
  auth:
    url: https://api.cdek.ru/v2
    client-id: ${CDEK_CLIENT_ID}
    client-secret: ${CDEK_CLIENT_SECRET}
    country-code: RU

admin:
  username: ${ADMIN_USERNAME}
  password: ${ADMIN_PASSWORD}