<div th:fragment="productItemsTab">

    <style>
        /* ================= LAYOUT ================= */
        #product-items-tab {
            margin-top: 15px;
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .add-row {
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .product-item {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            background-color: #f9f9f9;
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }

        .product-item:hover {
            background-color: #f0f0f0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .product-field {
            border: 1px solid #ccc;
            padding: 6px 10px;
            border-radius: 6px;
            text-align: center;
            min-width: 60px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .product-field:focus {
            border-color: #4CAF50;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
            outline: none;
        }

        /* ================= COLOR BLOCK ================= */
        .color-block {
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #ccc;
            padding: 4px 8px;
            border-radius: 6px;
            background-color: #fff;
        }

        .color-square {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 1px solid #999;
        }

        /* ================= CUSTOM SELECT ================= */
        .variant-select {
            position: relative;
            min-width: 240px;
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .variant-select.hidden {
            display: none;
        }

        .variant-placeholder {
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .variant-dropdown {
            position: absolute;
            left: 0;
            right: 0;
            top: 100%;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fff;
            display: none;
            z-index: 20;
            max-height: 240px;
            overflow-y: auto;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .variant-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            transition: background 0.2s ease;
            cursor: pointer;
        }

        .variant-option:hover {
            background-color: #f0f0f0;
        }

        /* ================= SAVE BUTTON ================= */
        #save-product-item-btn {
            padding: 8px 18px;
            border: none;
            border-radius: 6px;
            background-color: #4CAF50;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #save-product-item-btn:hover:not(:disabled) {
            background-color: #45a049;
            transform: translateY(-1px);
        }

        #save-product-item-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        #save-product-item-btn:disabled {
            background-color: #bbb;
            color: #666;
            cursor: not-allowed;
        }

        /* ================= RESPONSIVE ================= */
        @media (max-width: 600px) {
            .product-field,
            .color-block {
                flex: 1 1 100px;
            }

            .variant-select {
                min-width: 100%;
            }

            .add-row {
                gap: 8px;
            }

            #save-product-item-btn {
                width: 100%;
            }
        }
    </style>

    <div id="product-items-tab" class="tab-content">

        <!-- ========= ADD ITEM ========= -->

        <div class="add-row">

            <select id="product-select">
                <option value="" disabled selected>Продукт</option>
            </select>

            <div id="variant-select" class="variant-select hidden">
                <div id="variant-placeholder" class="variant-placeholder">
                    Вариация
                </div>
                <div id="variant-dropdown" class="variant-dropdown"></div>
            </div>

            <button id="save-product-item-btn" disabled>
                Сохранить
            </button>

        </div>

        <!-- ========= ITEMS ========= -->

        <div id="product-items-container"></div>

    </div>


    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", () => {

            /* ================= STATE ================= */

            const state = {
                products: [],
                sizes: [],
                colors: [],
                selectedProductId: null,
                selectedVariantId: null
            };

            /* ================= UI ================= */

            const ui = {
                productSelect: document.getElementById("product-select"),
                variantSelect: document.getElementById("variant-select"),
                variantDropdown: document.getElementById("variant-dropdown"),
                variantPlaceholder: document.getElementById("variant-placeholder"),
                saveBtn: document.getElementById("save-product-item-btn"),
                container: document.getElementById("product-items-container")
            };

            /* ================= API ================= */

            async function fetchJSON(url) {
                const res = await fetch(url);
                if (!res.ok) throw new Error(url);
                return await res.json();
            }

            /* ================= LOAD DATA ================= */

            async function loadInitialData() {

                const [products, sizes, colors] = await Promise.all([
                    fetchJSON("/api/products"),
                    fetchJSON("/api/sizes"),
                    fetchJSON("/api/colors")
                ]);

                state.products = products;
                state.sizes = sizes;
                state.colors = colors;

                products.forEach(p =>
                    ui.productSelect.add(new Option(p.name, p.id))
                );
            }

            const getSize = id => state.sizes.find(s => s.id == id);
            const getColor = id => state.colors.find(c => c.id == id);

            /* ================= RENDER ITEMS ================= */

            async function renderProductItems() {

                const items = await fetchJSON("/api/product-items");
                ui.container.innerHTML = "";

                items.forEach(item => {

                    const colorHex = "#" + item.colorHex;

                    const div = document.createElement("div");
                    div.className = "product-item";

                    div.innerHTML = `
            <span class="product-field">ItemId: ${item.productItemId}</span>
            <span class="product-field">${item.productName}</span>
            <span class="product-field">${item.sizeName}</span>

            <span class="color-block">
                <span class="color-square"
                      style="background:${colorHex}"></span>
                <span>${item.colorName}</span>
            </span>

            <span class="product-field">
                ${item.isSold ? "sold" : "available"}
            </span>
        `;

                    ui.container.appendChild(div);
                    let br = document.createElement('div');
                    br.style.display = 'block';
                });
            }

            /* ================= VARIANTS ================= */

            function renderVariants(productId) {

                ui.variantDropdown.innerHTML = "";
                ui.variantPlaceholder.textContent = "Вариация";

                const product = state.products.find(p => p.id == productId);

                if (!product?.variants?.length) {
                    ui.variantSelect.classList.add("hidden");
                    return;
                }

                product.variants.forEach(variant => {

                    const size = getSize(variant.size_id);
                    const color = getColor(variant.color_id);
                    const colorHex = "#" + color.hex;

                    const option = document.createElement("div");
                    option.className = "variant-option";

                    option.innerHTML = `
            <span>${size.name}</span>
            <span>|</span>
            <span class="color-square"
                  style="background:${colorHex}"></span>
            <span>${color.name}</span>
        `;

                    option.addEventListener("click", (e) => {

                        e.stopPropagation();

                        state.selectedVariantId = variant.variant_id;

                        ui.variantPlaceholder.innerHTML = `
                <span>${size.name}</span>
                <span>|</span>
                <span class="color-square"
                      style="background:${colorHex}"></span>
                <span>${color.name}</span>
            `;

                        ui.variantDropdown.style.display = "none";
                        ui.saveBtn.disabled = false;
                    });

                    ui.variantDropdown.appendChild(option);
                });

                ui.variantSelect.classList.remove("hidden");
            }

            /* ================= RESET ================= */

            function resetVariant() {
                state.selectedVariantId = null;
                ui.variantPlaceholder.textContent = "Вариация";
                ui.variantSelect.classList.add("hidden");
                ui.saveBtn.disabled = true;
            }

            /* ================= EVENTS ================= */

            ui.productSelect.addEventListener("change", () => {
                state.selectedProductId = ui.productSelect.value;
                resetVariant();
                renderVariants(state.selectedProductId);
            });

            ui.variantSelect.addEventListener("click", (e) => {
                e.stopPropagation();

                const isOpen =
                    ui.variantDropdown.style.display === "block";

                ui.variantDropdown.style.display =
                    isOpen ? "none" : "block";
            });

            document.addEventListener("click", e => {
                if (!ui.variantSelect.contains(e.target)) {
                    ui.variantDropdown.style.display = "none";
                }
            });

            ui.saveBtn.addEventListener("click", async () => {

                await fetch("/api/product-items", {
                    method: "POST",
                    headers: {"Content-Type":"application/json"},
                    body: JSON.stringify({
                        variantId: state.selectedVariantId
                    })
                });

                ui.productSelect.value = "";
                resetVariant();
                await renderProductItems();
            });

            /* ================= INIT ================= */

            (async function init(){
                await loadInitialData();
                await renderProductItems();
            })();

        });
    </script>

</div>
